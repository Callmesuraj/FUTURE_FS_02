<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mini CRM | Lead Management</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0A0A0A;
    --bg-2: #111111;
    --bg-card: #161616;
    --border: #222222;
    --amber: #F59E0B;
    --teal: #14B8A6;
    --red: #EF4444;
    --text: #EDEDED;
    --muted: #888888;
    --font-d: 'Space Grotesk', sans-serif;
    --font-b: 'Inter', sans-serif;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-b);
    min-height: 100vh;
  }
  a { color: inherit; }

  /* ── Login screen ─────────────────────────── */
  #loginScreen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .login-box {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px;
    width: 100%;
    max-width: 380px;
  }
  .login-title {
    font-family: var(--font-d);
    font-size: 1.6rem;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .login-title span { color: var(--amber); }
  .login-sub {
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 28px;
  }
  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-family: var(--font-d);
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 6px;
  }
  .field input, .field select, .field textarea {
    width: 100%;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 11px 14px;
    color: var(--text);
    font-family: var(--font-b);
    font-size: 0.9rem;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: none;
    border-color: var(--amber);
  }
  .btn {
    font-family: var(--font-d);
    font-weight: 600;
    font-size: 0.9rem;
    padding: 12px 20px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.15s;
  }
  .btn:hover { opacity: 0.88; }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--amber); color: #0A0A0A; width: 100%; }
  .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .btn-danger { background: rgba(239,68,68,0.12); color: var(--red); border: 1px solid rgba(239,68,68,0.3); }
  .btn-small { padding: 7px 14px; font-size: 0.78rem; }
  .error-msg {
    color: var(--red);
    font-size: 0.82rem;
    margin-top: 14px;
    display: none;
  }
  .error-msg.show { display: block; }
  .api-config {
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }
  .api-config label { font-size: 0.7rem; color: var(--muted); }
  .api-config input { font-size: 0.78rem; margin-top: 4px; }

  /* ── Dashboard ────────────────────────────── */
  #dashboard { display: none; }
  header {
    border-bottom: 1px solid var(--border);
    padding: 18px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    background: rgba(10,10,10,0.92);
    backdrop-filter: blur(10px);
    z-index: 10;
  }
  .header-title {
    font-family: var(--font-d);
    font-weight: 700;
    font-size: 1.2rem;
  }
  .header-title span { color: var(--amber); }
  .header-right { display: flex; align-items: center; gap: 14px; }
  .admin-badge {
    font-family: var(--font-d);
    font-size: 0.78rem;
    color: var(--muted);
  }

  main { padding: 28px; max-width: 1200px; margin: 0 auto; }

  .toolbar {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
    flex-wrap: wrap;
    align-items: center;
  }
  .toolbar input, .toolbar select {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--text);
    font-family: var(--font-b);
    font-size: 0.85rem;
  }
  .toolbar input { flex: 1; min-width: 200px; }
  .spacer { flex: 1; }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 14px;
    margin-bottom: 24px;
  }
  .stat-box {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
  }
  .stat-num { font-family: var(--font-d); font-size: 1.6rem; font-weight: 700; color: var(--amber); }
  .stat-label { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }

  .leads-grid { display: flex; flex-direction: column; gap: 10px; }

  .lead-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    flex-wrap: wrap;
    transition: border-color 0.2s;
  }
  .lead-card:hover { border-color: #333; }

  .lead-main { flex: 1; min-width: 220px; }
  .lead-name { font-family: var(--font-d); font-weight: 600; font-size: 1rem; margin-bottom: 3px; }
  .lead-email { color: var(--muted); font-size: 0.82rem; }
  .lead-meta { display: flex; gap: 10px; margin-top: 8px; flex-wrap: wrap; }

  .badge {
    font-family: var(--font-d);
    font-size: 0.7rem;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 20px;
    text-transform: capitalize;
  }
  .badge.new { background: rgba(20,184,166,0.12); color: var(--teal); }
  .badge.contacted { background: rgba(245,158,11,0.12); color: var(--amber); }
  .badge.converted { background: rgba(34,197,94,0.12); color: #22C55E; }
  .badge.lost { background: rgba(239,68,68,0.12); color: var(--red); }
  .badge.source { background: rgba(255,255,255,0.06); color: var(--muted); }

  .lead-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }

  /* ── Modal ────────────────────────────────── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px;
    width: 100%;
    max-width: 460px;
    max-height: 88vh;
    overflow-y: auto;
  }
  .modal-title {
    font-family: var(--font-d);
    font-weight: 700;
    font-size: 1.1rem;
    margin-bottom: 20px;
  }
  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 22px;
  }
  .modal-actions .btn { flex: 1; }

  .notes-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 14px;
    max-height: 180px;
    overflow-y: auto;
  }
  .note-item {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 0.82rem;
  }
  .note-date { color: var(--muted); font-size: 0.7rem; margin-top: 4px; }

  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 20px;
    font-size: 0.85rem;
    z-index: 200;
    display: none;
    max-width: 320px;
  }
  .toast.show { display: block; }
  .toast.success { border-color: rgba(20,184,166,0.4); color: var(--teal); }
  .toast.error { border-color: rgba(239,68,68,0.4); color: var(--red); }

  @media (max-width: 640px) {
    header { padding: 14px 16px; }
    main { padding: 16px; }
    .lead-card { flex-direction: column; }
    .lead-actions { width: 100%; }
  }
</style>
</head>
<body>

  <!-- ── Login Screen ─────────────────────── -->
  <div id="loginScreen">
    <div class="login-box">
      <div class="login-title">Mini <span>CRM</span></div>
      <div class="login-sub">Sign in to manage your leads</div>

      <form id="loginForm">
        <div class="field">
          <label>Username</label>
          <input type="text" id="loginUsername" required autocomplete="username" />
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="loginPassword" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary" id="loginBtn">Sign In</button>
        <p class="error-msg" id="loginError"></p>
      </form>

      <div class="api-config">
        <label>API Base URL (backend server)</label>
        <input type="text" id="apiBaseUrl" placeholder="http://localhost:5000" value="http://localhost:5000" />
      </div>
    </div>
  </div>

  <!-- ── Dashboard ─────────────────────────── -->
  <div id="dashboard">
    <header>
      <div class="header-title">Mini <span>CRM</span></div>
      <div class="header-right">
        <span class="admin-badge" id="adminBadge"></span>
        <button class="btn btn-outline btn-small" id="logoutBtn">Logout</button>
      </div>
    </header>

    <main>
      <div class="stats-row" id="statsRow"></div>

      <div class="toolbar">
        <input type="text" id="searchInput" placeholder="Search by name or email..." />
        <select id="statusFilter">
          <option value="all">All statuses</option>
          <option value="new">New</option>
          <option value="contacted">Contacted</option>
          <option value="converted">Converted</option>
          <option value="lost">Lost</option>
        </select>
        <div class="spacer"></div>
        <button class="btn btn-primary btn-small" id="addLeadBtn">+ Add Lead</button>
      </div>

      <div class="leads-grid" id="leadsGrid"></div>
    </main>
  </div>

  <!-- ── Add/Edit Lead Modal ───────────────── -->
  <div class="modal-overlay" id="leadModalOverlay">
    <div class="modal">
      <div class="modal-title" id="leadModalTitle">Add New Lead</div>
      <form id="leadForm">
        <input type="hidden" id="leadId" />
        <div class="field">
          <label>Name</label>
          <input type="text" id="leadName" required />
        </div>
        <div class="field">
          <label>Email</label>
          <input type="email" id="leadEmail" required />
        </div>
        <div class="field">
          <label>Phone</label>
          <input type="text" id="leadPhone" />
        </div>
        <div class="field">
          <label>Source</label>
          <select id="leadSource">
            <option>Website</option>
            <option>Referral</option>
            <option>Social Media</option>
            <option>Cold Outreach</option>
            <option>Other</option>
          </select>
        </div>
        <div class="field">
          <label>Status</label>
          <select id="leadStatus">
            <option value="new">New</option>
            <option value="contacted">Contacted</option>
            <option value="converted">Converted</option>
            <option value="lost">Lost</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" id="cancelLeadBtn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveLeadBtn">Save Lead</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ── Notes Modal ───────────────────────── -->
  <div class="modal-overlay" id="notesModalOverlay">
    <div class="modal">
      <div class="modal-title">Notes & Follow-ups — <span id="notesLeadName"></span></div>
      <div class="notes-list" id="notesList"></div>
      <div class="field">
        <label>Add a note</label>
        <textarea id="newNoteText" rows="3" placeholder="Follow-up details, call summary, next steps..."></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" id="closeNotesBtn">Close</button>
        <button type="button" class="btn btn-primary" id="addNoteBtn">Add Note</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  // ══════════════════════════════════════════════
  // STATE
  // ══════════════════════════════════════════════
  let API_BASE = localStorage.getItem('crm_api_base') || 'http://localhost:5000';
  let TOKEN = localStorage.getItem('crm_token') || null;
  let ADMIN_NAME = localStorage.getItem('crm_admin') || '';
  let leads = [];
  let currentNotesLeadId = null;

  const $ = (id) => document.getElementById(id);

  // ══════════════════════════════════════════════
  // TOAST
  // ══════════════════════════════════════════════
  function showToast(msg, type = 'success') {
    const t = $('toast');
    t.textContent = msg;
    t.className = 'toast show ' + type;
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  // ══════════════════════════════════════════════
  // AUTH
  // ══════════════════════════════════════════════
  function checkAuth() {
    if (TOKEN) {
      $('loginScreen').style.display = 'none';
      $('dashboard').style.display = 'block';
      $('adminBadge').textContent = 'Signed in as ' + ADMIN_NAME;
      loadLeads();
    } else {
      $('loginScreen').style.display = 'flex';
      $('dashboard').style.display = 'none';
    }
  }

  $('apiBaseUrl').value = API_BASE;

  $('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = $('loginUsername').value.trim();
    const password = $('loginPassword').value;
    API_BASE = $('apiBaseUrl').value.trim().replace(/\/$/, '');
    localStorage.setItem('crm_api_base', API_BASE);

    const btn = $('loginBtn');
    const errEl = $('loginError');
    errEl.classList.remove('show');
    btn.disabled = true;
    btn.textContent = 'Signing in...';

    try {
      const res = await fetch(`${API_BASE}/api/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();

      if (!res.ok) throw new Error(data.message || 'Login failed');

      TOKEN = data.token;
      ADMIN_NAME = data.username;
      localStorage.setItem('crm_token', TOKEN);
      localStorage.setItem('crm_admin', ADMIN_NAME);

      checkAuth();
    } catch (err) {
      errEl.textContent = err.message || 'Could not reach server. Check the API URL.';
      errEl.classList.add('show');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  });

  $('logoutBtn').addEventListener('click', () => {
    TOKEN = null;
    localStorage.removeItem('crm_token');
    localStorage.removeItem('crm_admin');
    checkAuth();
  });

  // ══════════════════════════════════════════════
  // API HELPER
  // ══════════════════════════════════════════════
  async function api(path, options = {}) {
    const res = await fetch(`${API_BASE}${path}`, {
      ...options,
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${TOKEN}`,
        ...(options.headers || {})
      }
    });

    if (res.status === 401) {
      showToast('Session expired. Please log in again.', 'error');
      TOKEN = null;
      localStorage.removeItem('crm_token');
      checkAuth();
      throw new Error('Unauthorized');
    }

    const data = await res.json();
    if (!res.ok) throw new Error(data.message || 'Request failed');
    return data;
  }

  // ══════════════════════════════════════════════
  // LOAD & RENDER LEADS
  // ══════════════════════════════════════════════
  async function loadLeads() {
    try {
      const search = $('searchInput').value.trim();
      const status = $('statusFilter').value;
      const params = new URLSearchParams();
      if (search) params.set('search', search);
      if (status !== 'all') params.set('status', status);

      leads = await api(`/api/leads?${params.toString()}`);
      renderStats();
      renderLeads();
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  function renderStats() {
    const counts = { new: 0, contacted: 0, converted: 0, lost: 0 };
    leads.forEach(l => { if (counts[l.status] !== undefined) counts[l.status]++; });

    $('statsRow').innerHTML = `
      <div class="stat-box"><div class="stat-num">${leads.length}</div><div class="stat-label">Total Leads</div></div>
      <div class="stat-box"><div class="stat-num">${counts.new}</div><div class="stat-label">New</div></div>
      <div class="stat-box"><div class="stat-num">${counts.contacted}</div><div class="stat-label">Contacted</div></div>
      <div class="stat-box"><div class="stat-num">${counts.converted}</div><div class="stat-label">Converted</div></div>
    `;
  }

  function renderLeads() {
    const grid = $('leadsGrid');

    if (leads.length === 0) {
      grid.innerHTML = `<div class="empty-state">No leads found. Click "+ Add Lead" to create one.</div>`;
      return;
    }

    grid.innerHTML = leads.map(lead => `
      <div class="lead-card">
        <div class="lead-main">
          <div class="lead-name">${escapeHtml(lead.name)}</div>
          <div class="lead-email">${escapeHtml(lead.email)}${lead.phone ? ' · ' + escapeHtml(lead.phone) : ''}</div>
          <div class="lead-meta">
            <span class="badge ${lead.status}">${lead.status}</span>
            <span class="badge source">${escapeHtml(lead.source)}</span>
            ${lead.notes && lead.notes.length ? `<span class="badge source">${lead.notes.length} note${lead.notes.length > 1 ? 's' : ''}</span>` : ''}
          </div>
        </div>
        <div class="lead-actions">
          <select class="status-select" data-id="${lead._id}" style="background:var(--bg-2);border:1px solid var(--border);border-radius:6px;padding:7px 10px;color:var(--text);font-size:0.78rem;">
            <option value="new" ${lead.status === 'new' ? 'selected' : ''}>New</option>
            <option value="contacted" ${lead.status === 'contacted' ? 'selected' : ''}>Contacted</option>
            <option value="converted" ${lead.status === 'converted' ? 'selected' : ''}>Converted</option>
            <option value="lost" ${lead.status === 'lost' ? 'selected' : ''}>Lost</option>
          </select>
          <button class="btn btn-outline btn-small notes-btn" data-id="${lead._id}">Notes</button>
          <button class="btn btn-outline btn-small edit-btn" data-id="${lead._id}">Edit</button>
          <button class="btn btn-danger btn-small delete-btn" data-id="${lead._id}">Delete</button>
        </div>
      </div>
    `).join('');

    document.querySelectorAll('.status-select').forEach(sel => {
      sel.addEventListener('change', (e) => updateStatus(e.target.dataset.id, e.target.value));
    });
    document.querySelectorAll('.notes-btn').forEach(btn => {
      btn.addEventListener('click', (e) => openNotesModal(e.target.dataset.id));
    });
    document.querySelectorAll('.edit-btn').forEach(btn => {
      btn.addEventListener('click', (e) => openEditModal(e.target.dataset.id));
    });
    document.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', (e) => deleteLead(e.target.dataset.id));
    });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  $('searchInput').addEventListener('input', debounce(loadLeads, 350));
  $('statusFilter').addEventListener('change', loadLeads);

  function debounce(fn, delay) {
    let timer;
    return (...args) => {
      clearTimeout(timer);
      timer = setTimeout(() => fn(...args), delay);
    };
  }

  // ══════════════════════════════════════════════
  // ADD / EDIT LEAD
  // ══════════════════════════════════════════════
  $('addLeadBtn').addEventListener('click', () => {
    $('leadModalTitle').textContent = 'Add New Lead';
    $('leadForm').reset();
    $('leadId').value = '';
    $('leadModalOverlay').classList.add('show');
  });

  function openEditModal(id) {
    const lead = leads.find(l => l._id === id);
    if (!lead) return;

    $('leadModalTitle').textContent = 'Edit Lead';
    $('leadId').value = lead._id;
    $('leadName').value = lead.name;
    $('leadEmail').value = lead.email;
    $('leadPhone').value = lead.phone || '';
    $('leadSource').value = lead.source;
    $('leadStatus').value = lead.status;
    $('leadModalOverlay').classList.add('show');
  }

  $('cancelLeadBtn').addEventListener('click', () => {
    $('leadModalOverlay').classList.remove('show');
  });

  $('leadForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = $('leadId').value;
    const payload = {
      name: $('leadName').value.trim(),
      email: $('leadEmail').value.trim(),
      phone: $('leadPhone').value.trim(),
      source: $('leadSource').value,
      status: $('leadStatus').value
    };

    try {
      if (id) {
        await api(`/api/leads/${id}`, { method: 'PUT', body: JSON.stringify(payload) });
        showToast('Lead updated successfully.');
      } else {
        await api('/api/leads', { method: 'POST', body: JSON.stringify(payload) });
        showToast('Lead added successfully.');
      }
      $('leadModalOverlay').classList.remove('show');
      loadLeads();
    } catch (err) {
      showToast(err.message, 'error');
    }
  });

  async function updateStatus(id, status) {
    try {
      const lead = leads.find(l => l._id === id);
      await api(`/api/leads/${id}`, {
        method: 'PUT',
        body: JSON.stringify({ ...lead, status })
      });
      showToast('Status updated.');
      loadLeads();
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  async function deleteLead(id) {
    if (!confirm('Delete this lead permanently?')) return;
    try {
      await api(`/api/leads/${id}`, { method: 'DELETE' });
      showToast('Lead deleted.');
      loadLeads();
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  // ══════════════════════════════════════════════
  // NOTES
  // ══════════════════════════════════════════════
  async function openNotesModal(id) {
    currentNotesLeadId = id;
    const lead = leads.find(l => l._id === id);
    if (!lead) return;

    $('notesLeadName').textContent = lead.name;
    renderNotes(lead.notes || []);
    $('newNoteText').value = '';
    $('notesModalOverlay').classList.add('show');
  }

  function renderNotes(notes) {
    const list = $('notesList');
    if (!notes.length) {
      list.innerHTML = `<p style="color:var(--muted);font-size:0.82rem;">No notes yet.</p>`;
      return;
    }
    list.innerHTML = notes.slice().reverse().map(n => `
      <div class="note-item">
        <div>${escapeHtml(n.text)}</div>
        <div class="note-date">${new Date(n.createdAt).toLocaleString()}</div>
      </div>
    `).join('');
  }

  $('addNoteBtn').addEventListener('click', async () => {
    const text = $('newNoteText').value.trim();
    if (!text) return;

    try {
      const updatedLead = await api(`/api/leads/${currentNotesLeadId}/notes`, {
        method: 'POST',
        body: JSON.stringify({ text })
      });
      renderNotes(updatedLead.notes);
      $('newNoteText').value = '';
      showToast('Note added.');

      const idx = leads.findIndex(l => l._id === currentNotesLeadId);
      if (idx > -1) leads[idx] = updatedLead;
      renderLeads();
    } catch (err) {
      showToast(err.message, 'error');
    }
  });

  $('closeNotesBtn').addEventListener('click', () => {
    $('notesModalOverlay').classList.remove('show');
  });

  // ══════════════════════════════════════════════
  // INIT
  // ══════════════════════════════════════════════
  checkAuth();
</script>

</body>
</html>
